name: Release Guards

on:
  pull_request:
    paths:
      - '.github/workflows/release-guards.yml'
      - 'frontend/**'
      - 'backend/**'
      - 'DEPLOYMENT.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-guards.yml'
      - 'frontend/**'
      - 'backend/**'
      - 'DEPLOYMENT.md'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  NODE_VERSION: 22.12.0

jobs:
  backend:
    name: Backend Build, Tests, Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/time_tracker_ci
      JWT_SECRET: ci-jwt-secret
      INTEGRATION_SECRET: ci-integration-secret
      CRON_SECRET: ci-cron-secret
      CORS_ORIGIN: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      ENABLE_BACKGROUND_WORKERS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Clean install
        run: npm ci

      - name: Prisma validate and generate
        run: npx prisma validate && npx prisma generate

      - name: Typecheck/build
        run: npm run build

      - name: Backend tests
        run: npm test -- --runInBand

      - name: Production dependency audit
        run: npm audit --omit=dev

  frontend:
    name: Frontend Typecheck, Lint, Unit, Build, Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Clean install
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint -- --max-warnings=2

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev

  migration-drift:
    name: Prisma Migration Bootstrap and Drift Guard
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: time_tracker_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/time_tracker_ci
      JWT_SECRET: ci-jwt-secret
      INTEGRATION_SECRET: ci-integration-secret
      CRON_SECRET: ci-cron-secret
      CORS_ORIGIN: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      ENABLE_BACKGROUND_WORKERS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Clean install
        run: npm ci

      - name: Empty database migrate deploy
        run: npm run release:migrate

      - name: Schema drift check
        run: npm run release:preflight

  playwright-smoke:
    name: Critical Playwright Smoke
    runs-on: ubuntu-latest
    needs:
      - frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Clean install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/webforx-frontend-preview.log 2>&1 &
          echo $! > /tmp/webforx-frontend-preview.pid

      - name: Wait for preview server
        run: |
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/webforx-frontend-preview.log || true
          exit 1

      - name: Run release guard E2E coverage
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npm run test:e2e:release-guards -- --project=chromium --workers=1

      - name: Upload Playwright artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-release-guard-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

      - name: Stop preview server
        if: ${{ always() }}
        run: |
          if [ -f /tmp/webforx-frontend-preview.pid ]; then
            kill "$(cat /tmp/webforx-frontend-preview.pid)" || true
          fi

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Reject common committed secret patterns
        run: |
          if git grep -nE '(ghp_[A-Za-z0-9_]{30,}|github_pat_[A-Za-z0-9_]{50,}|sk_live_[A-Za-z0-9]{20,}|sk_test_[A-Za-z0-9]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- . ':!package-lock.json' ':!frontend/package-lock.json' ':!backend/package-lock.json'; then
            echo "Potential committed secret detected."
            exit 1
          fi

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ddf5ce7296213f5548c91e2dd19df2d77d2b2d66
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@ddf5ce7296213f5548c91e2dd19df2d77d2b2d66

      - name: Analyze
        uses: github/codeql-action/analyze@ddf5ce7296213f5548c91e2dd19df2d77d2b2d66

  login-smoke:
    name: Login Smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      RELEASE_SMOKE_BASE_URL: ${{ secrets.RELEASE_SMOKE_BASE_URL || 'https://api.dev.webforxtech.com' }}
      RELEASE_SMOKE_EMAIL: ${{ secrets.RELEASE_SMOKE_EMAIL }}
      RELEASE_SMOKE_PASSWORD: ${{ secrets.RELEASE_SMOKE_PASSWORD }}
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/time_tracker_ci
      JWT_SECRET: ci-jwt-secret
      INTEGRATION_SECRET: ci-integration-secret
      CRON_SECRET: ci-cron-secret
      CORS_ORIGIN: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      ENABLE_BACKGROUND_WORKERS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Verify smoke secrets are configured
        run: |
          test -n "$RELEASE_SMOKE_BASE_URL"
          test -n "$RELEASE_SMOKE_EMAIL"
          test -n "$RELEASE_SMOKE_PASSWORD"

      - name: Clean install
        run: npm ci

      - name: Run login smoke check
        run: npm run release:smoke:login

  verification-complete:
    name: Verification Complete
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - migration-drift
      - playwright-smoke
      - login-smoke
      - secret-scan
      - codeql
    steps:
      - name: All required release guards passed
        run: echo "All required release guards passed."
